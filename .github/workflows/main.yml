name: Update oc.filer

on:
  repository_dispatch:
    types: dispatch-from-filer-service
  push:
  
env:
    imagetag: "${{ github.event.client_payload.ref || github.ref_name }}"
      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dump image tag ${{ env.imagetag }}
        run: echo ${{ env.imagetag }}
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/abcdesktopio/oc.filer:${{ env.imagetag }}
          build-args: |
            BRANCH=${{ env.imagetag }}
